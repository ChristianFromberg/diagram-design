  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --color-paper:#2d3142; --color-ink:#f5f5f5; --color-muted:#bfc0c0; --color-accent:#f08a59; }
    body { background:var(--color-paper); color:var(--color-ink); font-family:'Geist', system-ui, sans-serif; padding:24px; }
    main { max-width:760px; margin:0 auto; }
    .chart-scroll { overflow-x:auto; }
    .chart-scroll:focus-visible { outline:2px solid var(--color-accent); outline-offset:4px; }
    svg { display:block; width:100%; min-width:760px; font-family:'Geist', system-ui, sans-serif; font-variant-numeric:tabular-nums; }
    .scroll-hint { display:none; font-size:12px; color:var(--color-muted); margin-bottom:12px; }
    aside { margin:24px; padding-top:20px; border-top:1px solid rgba(245,245,245,0.12); }
    aside p { font-size:12px; line-height:1.6; color:var(--color-muted); margin-bottom:12px; max-width:72ch; }
    aside .aside-title { font-family:'Instrument Serif', serif; font-size:24px; color:var(--color-ink); line-height:1.2; }
    @media (max-width:807px) { body { padding:16px; } .scroll-hint { display:block; } }
    @media print { body { padding:0; } .scroll-hint { display:none; } svg { min-width:0; } .chart-scroll { overflow:visible; } }
